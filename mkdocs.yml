site_name: "Custom Objects"
site_description: "A plugin to manage custom objects in NetBox"
repo_url: https://github.com/netboxlabs/netbox-custom-objects
repo_name: "netboxlabs/netbox-custom-objects"

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - navigation.tracking
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Introduction: index.md
  - Setup:
      - Installation: installation.md
      - Configuration: configuration.md
      - Permissions: permissions.md
      - Upgrading: upgrading.md
      - Uninstalling: uninstalling.md
  - Using Custom Objects:
      - Field Attributes: field-attributes.md
      - Import and Export: import-export.md
      - Custom Objects Tab: related-objects-tab.md
      - Config Context and Templates: config-context.md
      - Branching Support: branching.md
      - Portable Schema: portable-schema.md
  - REST API: rest-api.md
  - GraphQL API: graphql.md
  - Data Model:
      - Custom Object Type: models/netbox_custom_objects/customobjecttype.md
      - Custom Object Type Field: models/netbox_custom_objects/customobjecttypefield.md
      - Custom Object Type Constraint: models/netbox_custom_objects/customobjecttypeconstraint.md
  - Troubleshooting: troubleshooting.md
  - Releases: releases.md
