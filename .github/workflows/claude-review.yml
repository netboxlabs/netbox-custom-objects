---
# .github/workflows/claude-review.yml
#
# Claude AI PR review. Triggered when an authorized human writes a
# comment or review containing "@claude" on a pull request in this
# repository.
#
# Required setup (per-plugin, one time):
#   - Set the ANTHROPIC_API_KEY secret on the repository (or inherit
#     from an organization-level secret).

name: Claude Code

"on":
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: >-
    claude-${{ github.event.pull_request.number
    || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude:
    if: |
      (github.event_name != 'issue_comment'
       || github.event.issue.pull_request != null)
      && contains(github.event.comment.body
                  || github.event.review.body, '@claude')
      && (github.event.comment.user.type
          || github.event.review.user.type) != 'Bot'
      && contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association
          || github.event.review.author_association
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read  # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Run Claude Code
        id: claude
        # anthropics/claude-code-action v1.0.248
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc  # yamllint disable-line rule:line-length
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
