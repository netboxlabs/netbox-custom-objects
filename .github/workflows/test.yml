---
# .github/workflows/test.yml
#
# PR validation: lint (pre-commit) then test matrix. The test job is
# gated on the lint job passing, so expensive CI minutes are spent only
# on green code. The Python axis lists the interpreter versions this
# plugin supports; the NetBox axis covers the declared
# min / max supported versions plus main as an early-warning canary.
#
# Test config:
#   The plugin's testing/configuration.py is loaded via
#   NETBOX_CONFIGURATION + PYTHONPATH, per the convention documented in
#   AGENTS.md Development section. The plugin is installed editable into
#   NetBox's checkout so its source path is on sys.path.
#
# Coverage:
#   Collected on a SINGLE matrix leg (see the matrix `include`) and run as
#   separate, individually-gated steps, mirroring NetBox core's CI:
#   coverage run -> coverage combine -> coverage report. Other legs run
#   plain `manage.py test`.
#
# The suite runs serially: its GraphQL schema-cache and query-count tests
# are not yet safe with `--parallel`, whose workers share one Redis cache.
#
# Plugin-specific legs (on top of the scaffold matrix):
#   - NetBox `feature`, so the upcoming NetBox release is covered too.
#   - `main` with netbox-branching installed: it changes model routing and
#     wires extra hooks, and some tests run only when it's installed. It is
#     split into two jobs, so neither comes near the timeout: the tests
#     tagged `branching` (slow TransactionTestCases that provision branches)
#     and the rest of the suite.

name: Test

"on":
  pull_request:
  push:
    branches: [main, feature]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
      # Same zensical pin as the docs extra in pyproject.toml.
      - name: Install zensical
        run: pip install 'zensical==0.0.43'
      - name: Build in-app model documentation
        run: |
          zensical build -s -f mkdocs.models.yml
          for page in customobjecttype customobjecttypefield customobjecttypeconstraint; do
            test -f netbox_custom_objects/static/docs/models/netbox_custom_objects/$page/index.html
          done
      - name: Build the docs site
        run: zensical build -s

  test:
    name: >-
      py${{ matrix.python-version }} / netbox-${{ matrix.netbox-ref }}${{
      matrix.branching && format(' (branching, {0})', matrix.shard) || '' }}${{
      matrix.coverage && ' (coverage)' || '' }}
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETBOX_CONFIGURATION: >-
        ${{ matrix.branching && 'configuration_branching' || 'configuration' }}
      PYTHONPATH: ${{ github.workspace }}/netbox-custom-objects/testing
      COVERAGE_RCFILE: ${{ github.workspace }}/netbox-custom-objects/pyproject.toml  # yamllint disable-line rule:line-length
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        netbox-ref:
          - 'v4.5.2'
          - 'v4.7.3'
          - 'main'
        # An axis of its own, so the branching leg below is added as a new
        # job rather than merged into the existing py3.12 / main one.
        branching: [false]
        include:
          - coverage: false
          # Collect coverage once, on the newest Python / max stable NetBox
          # leg. Avoids the min-version floor, where the table smoke test is
          # skipped (see tests/tables) and coverage would undercount.
          - python-version: '3.14'
            netbox-ref: 'v4.7.3'
            coverage: true
          - python-version: '3.12'
            netbox-ref: 'feature'
          - python-version: '3.12'
            netbox-ref: 'main'
            branching: true
            shard: 'branching tests'
            test-args: '--tag branching'
          - python-version: '3.12'
            netbox-ref: 'main'
            branching: true
            shard: 'other tests'
            test-args: '--exclude-tag branching'
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout plugin
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: netbox-custom-objects

      - name: Checkout NetBox
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox-ref }}
          path: netbox

      - name: Setup Python ${{ matrix.python-version }}
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install NetBox dependencies
        working-directory: netbox
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install plugin (editable, with test extras)
        working-directory: netbox-custom-objects
        run: pip install -e '.[test]'

      - name: Install netbox-branching
        if: ${{ matrix.branching }}
        run: pip install 'netboxlabs-netbox-branching>=1.0.4,<2.0.0'

      - name: Tune PostgreSQL for test performance
        run: |
          sudo apt-get install -y -q postgresql-client
          PGPASSWORD=netbox psql -h localhost -U netbox \
            -c "ALTER SYSTEM SET checkpoint_timeout = '30min'" \
            -c "ALTER SYSTEM SET max_wal_size = '2GB'" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET lock_timeout = '60s'" \
            -c "SELECT pg_reload_conf()"

      - name: Run tests
        if: ${{ ! matrix.coverage }}
        working-directory: netbox
        run: >-
          python netbox/manage.py test
          netbox_custom_objects.tests
          ${{ matrix.test-args }}

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        working-directory: netbox
        run: >-
          coverage run netbox/manage.py test
          netbox_custom_objects.tests

      - name: Combine coverage data
        if: ${{ matrix.coverage }}
        working-directory: netbox
        run: coverage combine

      - name: Show coverage report
        if: ${{ matrix.coverage }}
        working-directory: netbox
        run: coverage report
